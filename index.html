<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AeroRail｜機捷機場旅程決策助理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230b4da2'/%3E%3Cpath d='M16 6h13l20 52H36z' fill='%2337c9f3'/%3E%3Cpath d='M29 6h11l12 52H41z' fill='%23fff' fill-opacity='.88'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --bg: #eaf6ff;
      --bg2: #f7fbff;
      --ink: #10213b;
      --muted: #40516d;
      --subtle: #64748b;
      --line: #d9e7f3;
      --card: rgba(255, 255, 255, 0.94);
      --card-solid: #ffffff;
      --rail: #0b4da2;
      --rail-2: #0f6fca;
      --accent: #d98200;
      --accent-2: #f0a42a;
      --accent-soft: #fff3da;
      --ok: #15803d;
      --warn: #b45309;
      --danger: #be123c;
      --inbound: #0f766e;
      --inbound-2: #14b8a6;
      --shadow: 0 18px 44px rgba(32, 75, 120, 0.14);
      --shadow-soft: 0 10px 28px rgba(31, 73, 118, 0.10);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
      --tap: 52px;
      --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body[data-mode="inbound"] {
      --accent: var(--inbound);
      --accent-2: var(--inbound-2);
      --accent-soft: #e6fffb;
      --bg: #e9fbf8;
      --bg2: #f6fffd;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; height: 100%; background: #dfeefa; }
    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 12%, rgba(255,255,255,.94), transparent 28%),
        radial-gradient(circle at 86% 8%, rgba(120, 199, 255, .24), transparent 24%),
        linear-gradient(180deg, var(--bg), var(--bg2) 48%, #ffffff);
      font-size: 18px;
      line-height: 1.55;
      text-wrap: pretty;
      overflow: hidden;
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page {
      width: min(1220px, calc(100vw - 28px));
      min-height: 0;
      height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(360px, 452px) minmax(360px, 1fr);
      gap: 34px;
      align-items: start;
      padding: 28px 0;
    }

    .phoneFrame {
      position: sticky;
      top: 18px;
      width: min(452px, 100%);
      margin: 0 auto;
      padding: 12px;
      border-radius: 46px;
      background: linear-gradient(145deg, #173860, #0b1c31 56%, #071322);
      box-shadow: 0 26px 80px rgba(7, 24, 45, .32);
    }

    .phone {
      position: relative;
      min-height: 0;
      height: min(844px, calc(100vh - 80px));
      max-height: none;
      overflow: auto;
      border-radius: 36px;
      background:
        linear-gradient(180deg, rgba(215, 239, 255, .96) 0%, rgba(244, 251, 255, .96) 34%, rgba(255,255,255,.98) 100%);
      scrollbar-width: none;
    }
    .phone::-webkit-scrollbar { display: none; }

    .statusBar {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .statusRight { display:flex; gap:5px; align-items:center; }
    .signal { width: 18px; height: 10px; display:flex; align-items:flex-end; gap:2px; }
    .signal i { display:block; width:3px; background:#12233d; border-radius:2px; }
    .signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:8px}.signal i:nth-child(4){height:10px}
    .battery { width: 24px; height: 12px; border:2px solid #12233d; border-radius:4px; position:relative; }
    .battery::after { content:""; position:absolute; right:-5px; top:3px; width:3px; height:5px; border-radius:2px; background:#12233d; }
    .battery::before { content:""; position:absolute; inset:2px 5px 2px 2px; border-radius:2px; background:#12233d; }

    .appTop {
      padding: 8px 24px 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }
    .brandMark { display:flex; gap:12px; align-items:center; min-width:0; }
    .logoMark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(145deg, #ffffff 0%, #d9efff 42%, #0b4da2 43%, #08285b 100%);
      box-shadow: 0 8px 20px rgba(20, 78, 140, .18);
      position: relative;
      overflow:hidden;
      flex: 0 0 auto;
    }
    .logoMark::before {
      content:"";
      position:absolute;
      width: 15px;
      height: 74px;
      left: 11px;
      top: -10px;
      transform: rotate(-24deg);
      background: #37c9f3;
      border-radius: 999px;
      box-shadow: 14px 0 0 rgba(255,255,255,.88);
    }
    .brandCopy { min-width:0; }
    .brandCopy b { display:block; font-size: 22px; line-height:1.1; letter-spacing:-.03em; }
    .brandCopy span { display:block; font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .statusPill {
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(15, 77, 162, .12);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .modeSwitch {
      margin: 0 22px 18px;
      padding: 5px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      border-radius: 18px;
      background: rgba(255,255,255,.66);
      border: 1px solid rgba(15,77,162,.10);
    }
    .modeSwitch button {
      min-height: 48px;
      border:0;
      border-radius: 14px;
      color: var(--muted);
      background: transparent;
      font-weight: 900;
      cursor:pointer;
    }
    .modeSwitch button.active {
      color: white;
      background: linear-gradient(135deg, var(--rail), var(--accent));
      box-shadow: 0 10px 24px rgba(12,77,151,.20);
    }
    body[data-view="home"] .modeSwitch { display: none; }

    .screen { padding: 0 20px 102px; }
    body[data-view="home"] .screen { min-height: 620px; padding-top: 22px; }
    @keyframes enter { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

    .heroCard, .panelCard, .decisionCard, .softCard, .timelineCard {
      background: var(--card);
      border: 1px solid rgba(15, 77, 162, .12);
      box-shadow: var(--shadow-soft);
      border-radius: var(--radius-lg);
    }
    .heroCard { padding: 18px; margin-bottom: 14px; }
    body[data-view="home"] .heroCard {
      padding: 8px 4px 0;
      margin-bottom: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      border-radius: 0;
    }
    body[data-view="home"] .heroCard h1 {
      font-size: clamp(23px, 5.4vw, 28px);
      line-height:1.18;
      letter-spacing:-.035em;
      margin: 0;
      color: #5d728e;
      font-weight: 760;
    }
    .eyebrow {
      display: inline-flex;
      align-items:center;
      gap:8px;
      color: var(--accent);
      font-weight: 900;
      font-size: 13px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .dot { width: 8px; height: 8px; border-radius:999px; background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
    h1, h2, h3, p { margin-top: 0; }
    .heroCard h1 { margin: 8px 0 7px; font-size: clamp(29px, 7vw, 36px); line-height:1.08; letter-spacing:-.045em; }
    body[data-view="input"][data-mode="outbound"] .heroCard h1 { font-size: 25px; line-height:1.15; letter-spacing:-.055em; white-space:nowrap; }
    body[data-view="input"][data-mode="inbound"] .heroCard h1 { font-size: 25px; line-height:1.15; letter-spacing:-.055em; white-space:nowrap; }
    .heroCard p { margin-bottom: 0; color: var(--muted); font-size: 15px; }

    .purposeGrid { display:grid; gap: 12px; margin: 14px 0 16px; }
    body[data-view="home"] .purposeGrid { margin-top: 28px; gap: 14px; }
    .purposeCard {
      width: 100%;
      min-height: 142px;
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items:center;
      text-align:left;
      padding: 18px;
      border-radius: 24px;
      border: 1px solid rgba(15,77,162,.14);
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow-soft);
      color: var(--ink);
      cursor:pointer;
    }
    .purposeCard span { color: var(--accent); font-size: 13px; font-weight: 950; letter-spacing:.08em; }
    .purposeCard h2 { margin: 5px 0 5px; font-size: 25px; line-height:1.12; letter-spacing:-.035em; }
    .purposeCard p { margin:0; color: var(--muted); font-size: 14px; line-height:1.45; }
    body[data-view="home"] .purposeCard { min-height: 174px; padding: 28px 18px; }
    body[data-view="home"] .purposeCard.outbound {
      background: linear-gradient(135deg, #fff7e8 0%, #fffdf8 72%);
      border-color: #f0c36a;
    }
    body[data-view="home"] .purposeCard.inbound {
      background: linear-gradient(135deg, #e7fffb 0%, #f9fffe 72%);
      border-color: #89d8ce;
    }
    body[data-view="home"] .purposeCard.other {
      min-height: 112px;
      padding: 20px 18px;
      background: linear-gradient(135deg, #eef4fb 0%, #fbfdff 72%);
      border-color: #c8d7e8;
      cursor: default;
    }
    body[data-view="home"] .purposeCard h2 { margin:0 0 8px; font-size: 44px; line-height:1.0; letter-spacing:-.06em; }
    body[data-view="home"] .purposeCard p { font-size: 17px; line-height:1.35; font-weight:900; }
    body[data-view="home"] .purposeCard.other h2 { font-size: 25px; letter-spacing:-.04em; }
    body[data-view="home"] .purposeCard.other p { display:none; }
    .purposeCard b {
      width: 42px; height: 42px;
      display:grid; place-items:center;
      border-radius:999px;
      color:#fff;
      background: linear-gradient(135deg, var(--rail), var(--accent));
      font-size: 22px;
    }
    .purposeCard.inbound span { color: var(--inbound); }
    .purposeCard.inbound b { background: linear-gradient(135deg, var(--rail), var(--inbound)); }

    .inputGrid { display:grid; gap: 10px; margin-top: 14px; }
    .field label { display:block; color: var(--muted); font-size: 13px; font-weight: 900; margin: 0 0 6px 4px; }
    .control {
      width:100%; min-height: 50px;
      padding: 0 16px;
      border-radius: 16px;
      border: 1px solid #c7d8ea;
      background: #fff;
      color: var(--ink);
      font-size: 18px;
      font-weight: 800;
      outline: none;
    }
    .control:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .locationControlRow { display:grid; grid-template-columns: 1fr 52px; gap: 10px; align-items:center; }
    .gpsBtn {
      width:52px; height:52px;
      border: 1px solid rgba(217, 130, 0, .26);
      border-radius: 999px;
      color: var(--accent);
      background: linear-gradient(135deg, #fff8ea, #fffdf8);
      box-shadow: 0 10px 22px rgba(217, 130, 0, .14);
      font-size: 0;
      cursor:pointer;
      display:grid;
      place-items:center;
      position: relative;
    }
    .gpsBtn svg { width: 21px; height: 21px; display:block; }
    body[data-mode="inbound"] .gpsBtn { color: var(--inbound); border-color: rgba(18, 184, 166, .30); background: linear-gradient(135deg, #e7fffb, #f8fffe); box-shadow: 0 10px 22px rgba(18,184,166,.13); }
    .gpsBtn:active { transform: translateY(1px) scale(.98); }
    .chipRow { display:flex; flex-wrap:wrap; gap: 9px; margin-top: 6px; }
    .chip, .scenarioChip {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid #cbdced;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      cursor:pointer;
    }
    .chip.active, .scenarioChip.active {
      border-color: color-mix(in srgb, var(--accent) 65%, white);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .primaryBtn, .secondaryBtn {
      width:100%; min-height: 54px;
      border-radius: 18px;
      border:0;
      font-size: 18px;
      font-weight: 950;
      cursor:pointer;
      transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
    }
    .primaryBtn {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 16px 30px rgba(217, 130, 0, .22);
      margin-top: 12px;
    }
    body[data-mode="inbound"] .primaryBtn { box-shadow: 0 16px 30px rgba(15, 118, 110, .20); }
    .secondaryBtn {
      color: var(--rail);
      background: #fff;
      border: 1px solid #cbdced;
    }
    .primaryBtn:active, .secondaryBtn:active, .chip:active, .scenarioChip:active, .iconBtn:active { transform: translateY(1px) scale(.99); }

    .flowStrip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 16px 0;
    }
    .flowStepMini {
      min-height: 88px;
      border-radius: 18px;
      background: rgba(255,255,255,.74);
      border: 1px solid rgba(15,77,162,.10);
      padding: 11px 8px;
      text-align:center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }
    .flowStepMini strong {
      display:grid;
      place-items:center;
      width: 30px; height: 30px;
      margin: 0 auto 7px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #c7d8ea;
      color: var(--rail);
      font-size: 15px;
    }
    .flowStepMini.active strong { background: var(--accent); border-color: var(--accent); color: #fff; }
    .flowStepMini.active { color: var(--ink); box-shadow: 0 8px 18px rgba(24, 78, 131, .08); }

    .decisionCard { padding: 14px 18px 18px; margin-bottom: 14px; }
    .decisionTop { display:flex; justify-content:space-between; align-items:start; gap: 12px; margin-bottom: 10px; }
    .flightBadge {
      display:inline-flex; align-items:center; min-height: 34px; padding: 0 12px;
      border-radius: 999px; background:#fff; border:1px solid #d3e0ee;
      color: var(--ink); font-weight: 950; font-size: 16px;
    }
    .now { color: var(--muted); font-size: 13px; font-weight: 900; text-align:right; }
    .bigTime {
      margin: 4px 0 2px;
      font-size: clamp(44px, 13vw, 58px);
      line-height: .98;
      letter-spacing: -.07em;
      font-weight: 950;
      color: var(--ink);
    }
    .bigTime small { font-size: .45em; letter-spacing: -.04em; }
    .subtitle { font-size: 16px; font-weight: 950; color: var(--muted); margin-bottom: 12px; }
    .decisionLead {
      margin: 8px 0 14px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .departAction {
      padding: 12px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--rail), #10355d 58%, var(--accent));
      color:#fff;
      box-shadow: 0 16px 34px rgba(20, 74, 136, .20);
    }
    .departAction span { display:block; font-size: 12px; font-weight: 900; opacity: .82; letter-spacing:.03em; }
    .departAction strong { display:block; margin-top: 2px; font-size: 18px; line-height:1.14; letter-spacing:-.035em; }
    .tripSummaryGrid { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 9px 0; }
    .tripSummaryItem {
      min-height: 66px;
      padding: 9px 10px;
      border-radius: 16px;
      background:#fff;
      border: 1px solid #dbe6f0;
      box-shadow: 0 7px 16px rgba(26,73,120,.06);
    }
    .tripSummaryItem span { display:block; color: var(--muted); font-size: 11px; font-weight: 950; margin-bottom: 3px; }
    .tripSummaryItem strong { display:block; color: var(--ink); font-size: 17px; line-height:1.1; letter-spacing:-.035em; font-weight: 950; }
    .tripSummaryItem.risk strong { color: var(--warn); }
    .reasonBox, .backupBox {
      padding: 14px;
      border-radius: 18px;
      background:#fff;
      border: 1px solid #dbe6f0;
      margin-top: 10px;
    }
    .reasonBox b, .backupBox b { display:block; margin-bottom: 6px; font-size: 15px; }
    .reasonBox p, .backupBox p { margin:0; color: var(--muted); font-size: 14px; font-weight: 760; line-height:1.48; }
    .backupBox { background: linear-gradient(180deg, #fff8ea, #fffdf8); border-color: #efd397; }
    .progressLabel { display:flex; justify-content:space-between; font-size: 12px; color: var(--muted); font-weight: 900; margin: 7px 0 6px; }
    .bar { height: 12px; border-radius:999px; background: #edf1f5; overflow:hidden; box-shadow: inset 0 1px 3px rgba(12,35,64,.08); }
    .bar i { display:block; height:100%; width: var(--value, 28%); background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:inherit; }

    .pathLine { margin: 12px 0 12px; display:grid; grid-template-columns: repeat(4, 1fr); position:relative; gap: 5px; }
    .pathLine::before { content:""; position:absolute; left: 11%; right: 11%; top: 20px; height: 2px; background: repeating-linear-gradient(90deg, #cad7e5 0 9px, transparent 9px 17px); }
    .pathItem { position:relative; text-align:center; font-size: 12px; font-weight: 900; color: var(--muted); z-index: 1; }
    .pathItem b { display:grid; place-items:center; width: 40px; height: 40px; margin:0 auto 5px; border-radius:999px; background:#fff; border: 2px solid #d1dfeb; color: var(--muted); font-size: 17px; box-shadow: 0 5px 14px rgba(24,66,110,.06); }
    .pathItem.done b, .pathItem.active b { border-color: var(--accent); color: var(--accent); }
    .pathItem.active span { color: var(--ink); }

    .metricGrid { display:grid; grid-template-columns: 1fr 1fr; border: 1px solid #dbe6f0; border-radius: 20px; overflow:hidden; background:#fff; margin: 16px 0; }
    .metric { padding: 12px 8px; text-align:center; border-bottom: 1px solid #e5eef6; }
    .metric:nth-child(odd) { border-right: 1px solid #e5eef6; }
    .metric:nth-last-child(-n+2) { border-bottom:0; }
    .metric span { display:block; color: var(--muted); font-size: 13px; font-weight: 900; margin-bottom: 6px; }
    .metric strong { display:block; font-size: 21px; line-height:1.1; font-weight: 950; letter-spacing:-.035em; }
    .metric.risk strong { color: var(--warn); }

    .basisPills { display:flex; flex-wrap:wrap; gap: 8px; margin: 12px 0 2px; }
    .basisPills span { padding: 9px 11px; border-radius: 12px; background: #fff; border: 1px solid #d8e5f1; color: var(--ink); font-weight: 850; font-size: 13px; }

    .alertBox {
      margin-top: 14px;
      padding: 15px 15px;
      border-radius: 18px;
      border: 1px solid color-mix(in srgb, var(--accent) 38%, #ffffff);
      background: linear-gradient(180deg, var(--accent-soft), #fffdf7);
      color: var(--ink);
      font-size: 16px;
      font-weight: 850;
    }
    .alertBox strong { color: var(--accent); font-size: 22px; }

    .actionStack { display:grid; gap: 10px; margin-top: 14px; }
    .twoActions { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .iconBtn { min-height: 48px; border-radius: 16px; border: 1px solid #cbdced; background: #fff; color: var(--rail); font-weight: 950; cursor:pointer; }

    .panelCard { padding: 18px; margin-bottom: 14px; }
    .panelCard h2 { font-size: 25px; line-height:1.16; letter-spacing:-.04em; margin-bottom: 7px; }
    .panelCard p { color: var(--muted); font-size: 15px; margin-bottom: 0; }
    .sectionTitle { display:flex; align-items:center; justify-content:space-between; gap: 12px; margin: 12px 4px 8px; }
    .sectionTitle h2 { margin:0; font-size: 20px; line-height:1.2; letter-spacing:-.03em; }
    .sectionTitle span { color: var(--subtle); font-size: 11px; font-weight:900; }
    .sectionTitle + .chipRow { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .sectionTitle + .chipRow::-webkit-scrollbar { display: none; }

    .evidenceSummaryGrid { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
    .evidenceSummaryGrid .tripSummaryItem { min-height: 58px; }
    .confidenceStrip { display:grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 10px; }
    .confidenceStep { border-radius: 14px; padding: 9px 6px; background:#fff; border:1px solid #dbe6f0; text-align:center; }
    .confidenceStep b { display:block; font-size: 13px; line-height:1.15; color: var(--ink); }
    .confidenceStep span { display:block; margin-top: 3px; font-size: 10px; font-weight: 900; color: var(--subtle); }
    .sourceList { display:grid; gap: 10px; }
    .sourceItem {
      border-radius: 18px;
      background:#fff;
      border: 1px solid #dbe6f0;
      overflow:hidden;
    }
    .sourceItem summary {
      display:grid; grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items:center;
      padding: 13px 14px;
      cursor:pointer;
      list-style:none;
    }
    .sourceItem summary::-webkit-details-marker { display:none; }
    .sourceDot { width: 12px; height: 12px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
    .sourceItem b { display:block; font-size: 15px; line-height:1.2; }
    .sourceItem small { display:block; color: var(--subtle); margin-top: 3px; font-weight: 750; }

      ];
      return `
        <article class="panelCard"><span class="eyebrow"><span class="dot"></span>系統決策流程</span><h2>${isInbound ? '從抵達資訊到接續交通建議' : '從出發資訊到機捷旅程建議'}</h2><p>AeroRail 以桃園機捷為核心，將航班、航廈與環境資料作為風險修正；沒有直接即時資料時，採用當日推估或歷史基準並清楚標示。</p></article>
        <div class="flowDiagram">${layers.map((l,i)=>`<div class="layerCard"><div class="layerHead"><span class="layerNo">${i+1}</span><div><h3>${l.title}</h3><p>${l.desc}</p></div></div>${l.rules ? `<div class="decisionRuleGrid">${l.rules.map(r=>`<div class="decisionRule"><b>${r[0]}</b><small>${r[1]}</small></div>`).join('')}</div>` : `<div class="miniList">${l.items.map(item=>`<span>${item}</span>`).join('')}</div>`}</div>`).join('')}</div>
        <div class="actionStack"><button class="primaryBtn" data-go="${isInbound ? 'inbound' : 'outbound'}" type="button">回到${isInbound ? '接續卡' : '旅程卡'}</button></div>
      `;
    }

    function renderOps() {
      const isInbound = appState.mode === 'inbound';
      const trends = isInbound
        ? [
            ['夜間接續提醒', '若晚間抵達查詢集中，可在入境大廳與機捷入口加強末班與夜間備案提醒。'],
            ['A18 轉乘需求', '高鐵接續查詢偏多時，可加強 A18 月台方向與末段班次確認提示。'],
            ['行李延遲風險', '匿名趨勢若顯示行李等待拉長，旅客端可提前提高緩衝與備案提示。']
          ]
        : [
            ['A1 進站需求', '早晨出境查詢集中於 A1 時，可加強直達車月台、報到緩衝與航廈提醒。'],
            ['航廈人潮偏高', '當日預測偏高時，旅客端提早提示報到與安檢緩衝，不顯示個別旅客資料。'],
            ['停車銜接壓力', '停車條件被大量勾選時，可加強 A18 轉乘、找車位時間與接送備案提醒。']
          ];
      return `
        <article class="panelCard"><span class="eyebrow"><span class="dot"></span>匿名彙整服務趨勢</span><h2>${isInbound ? '觀察接續需求，改善抵達後指引' : '觀察出境需求，改善前往機場指引'}</h2><p>此頁只呈現匿名彙整趨勢，用於服務提醒、站內指引與資訊設計改善；不顯示個別旅客行程、姓名、定位紀錄或可識別資料。</p></article>
        <div class="opsGrid">
          <div class="opsMetric"><span>${isInbound ? '熱門接續方向' : '熱門進站節點'}</span><strong>${isInbound ? '台北／A18' : 'A1／A18'}</strong></div>
          <div class="opsMetric"><span>尖峰風險</span><strong>${isInbound ? '夜間偏緊' : '中高'}</strong></div>
          <div class="opsMetric"><span>常見備案原因</span><strong>${isInbound ? '末班' : '人潮'}</strong></div>
          <div class="opsMetric"><span>改善重點</span><strong>${isInbound ? '接續提示' : '提早提醒'}</strong></div>
        </div>
        <div class="trendList">${trends.map(t=>`<div class="trendItem"><b>${t[0]}</b><p>${t[1]}</p></div>`).join('')}</div>
        <article class="panelCard" style="margin-top:14px"><h2>服務改善使用方式</h2><p>趨勢只用來調整旅客提醒、站內告示、節慶疏運資訊與常見備案說明；實際乘車與現場狀態仍以官方公告與車站顯示為準。</p></article>
      `;
    }

    function renderBottomNav() {
      bottomNav.innerHTML = navItems.map(([view, label, icon]) => {
        const actual = view === 'outbound' && appState.mode === 'inbound' ? 'inbound' : view;
        const displayLabel = view === 'outbound' ? (appState.mode === 'inbound' ? '接續卡' : '旅程卡') : label;
        const active = appState.view === view || (view === 'outbound' && appState.view === 'inbound');
        const iconMarkup = icon === 'home'
          ? `<svg class="navIcon navSvg" viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7V20a1 1 0 0 1-1 1h-4.5v-6h-6v6H4.5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>`
          : `<span class="navIcon ${icon}"></span>`;
        return `<button type="button" class="${active?'active':''}" data-go="${actual}">${iconMarkup}${displayLabel}</button>`;
      }).join('');
    }

    function bind() {
      document.getElementById('modeOutbound').onclick = () => setMode('outbound');
      document.getElementById('modeInbound').onclick = () => setMode('inbound');
      document.querySelectorAll('[data-go]').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.go)));
      document.querySelectorAll('[data-purpose]').forEach(btn => btn.addEventListener('click', () => selectPurpose(btn.dataset.purpose)));
      document.querySelectorAll('[data-chip]').forEach(btn => btn.addEventListener('click', () => {
        const key = btn.dataset.chip;
        appState.chips.has(key) ? appState.chips.delete(key) : appState.chips.add(key);
        render();
      }));
      document.querySelectorAll('[data-scenario]').forEach(btn => btn.addEventListener('click', () => { appState.scenario = btn.dataset.scenario; render(); }));
      document.querySelectorAll('[data-inbound-scenario]').forEach(btn => btn.addEventListener('click', () => { appState.inboundScenario = btn.dataset.inboundScenario; render(); }));
      const gen = document.getElementById('generateBtn');
      if (gen) gen.onclick = () => setView(appState.mode === 'inbound' ? 'inbound' : 'outbound');
      const flight = document.getElementById('flightSelect');
      if (flight) flight.onchange = () => { appState.flight = flight.value; };
      const destInput = document.getElementById('destInput');
      if (destInput) destInput.oninput = () => { appState.destination = destInput.value; };
      const locInput = document.getElementById('locInput');
      if (locInput) locInput.oninput = () => { appState.location = locInput.value; };
      const gpsBtn = document.getElementById('gpsBtn');
      if (gpsBtn && locInput) gpsBtn.onclick = () => {
        locInput.value = '正在取得目前位置…';
        if (!navigator.geolocation) {
          locInput.value = '目前位置';
          appState.location = locInput.value;
          return;
        }
        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = pos.coords.latitude.toFixed(5);
            const lng = pos.coords.longitude.toFixed(5);
            locInput.value = `目前位置（${lat}, ${lng}）`;
            appState.location = locInput.value;
          },
          () => {
            locInput.value = '目前位置';
            appState.location = locInput.value;
          },
          { enableHighAccuracy: true, timeout: 4500, maximumAge: 60000 }
        );
      };
    }

    function render() {
      document.body.dataset.mode = appState.mode;
      document.body.dataset.view = appState.view;
      document.getElementById('statusPill').textContent = appState.mode === 'inbound' ? '資料更新 22:34' : '資料更新 06:42';
      document.getElementById('modeOutbound').classList.toggle('active', appState.mode === 'outbound');
      document.getElementById('modeInbound').classList.toggle('active', appState.mode === 'inbound');
      const time = appState.mode === 'inbound' ? '22:34' : '06:42';
      document.getElementById('phoneTime').textContent = time;
      if (appState.view === 'home') root.innerHTML = renderHome();
      else if (appState.view === 'input') root.innerHTML = renderInput();
      else if (appState.view === 'outbound') root.innerHTML = renderDecision('outbound');
      else if (appState.view === 'inbound') root.innerHTML = renderDecision('inbound');
      else if (appState.view === 'evidence') root.innerHTML = renderEvidence();
      else if (appState.view === 'flow') root.innerHTML = renderFlow();
      else if (appState.view === 'ops') root.innerHTML = renderOps();
      else root.innerHTML = renderHome();
      renderBottomNav();
      bind();
    }

    render();
  </script>
</body>
</html>
